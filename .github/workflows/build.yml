name: Build & Verify

# No repository secrets are required anywhere in this workflow.
# It only uses GITHUB_TOKEN, which GitHub provides automatically to every
# workflow run — you don't need to create or configure it.
#
# Runs on every push and pull request, plus a manual "Run workflow" button
# (workflow_dispatch) so you can trigger it on demand from the Actions tab.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel older in-progress runs on the same branch/PR when new commits land,
# so the Actions tab doesn't pile up stale runs for a branch you're actively pushing to.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # lets the test-report action publish check annotations
  pull-requests: write  # lets it comment results on PRs

env:
  # Keep Gradle's own console output compact; our step names carry the
  # structure, so we don't need Gradle re-printing a wall of task names.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Toolchain setup
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Gradle wrapper if missing
        id: gradle_cmd
        run: |
          # If gradlew (and its jar) aren't committed to the repo, build
          # them right here using the "gradle" binary setup-gradle just
          # provisioned. This produces the real gradlew, gradlew.bat, and
          # gradle/wrapper/gradle-wrapper.jar — not a stand-in — so every
          # later step in this workflow (and anyone who checks out this
          # commit afterward) can rely on a normal ./gradlew existing.
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ Gradle wrapper already committed — using it as-is."
          else
            echo "⚙️ No committed wrapper found — generating one with Gradle 8.9 now."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi

          chmod +x ./gradlew
          echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"

      - name: Verify generated wrapper
        run: |
          echo "### 🧱 Gradle wrapper" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar present ($(du -h ./gradle/wrapper/gradle-wrapper.jar | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::gradle-wrapper.jar still missing after generation step — failing early instead of a confusing ./gradlew: command not found later."
            exit 1
          fi

      - name: Upload Gradle wrapper artifact
        # Always uploaded — whether it was already committed or generated
        # just now — so you can grab it from this run's Artifacts and
        # commit it into the repo yourself if it wasn't there already.
        # Committing it means future runs skip generation and every
        # contributor's local ./gradlew uses the exact same Gradle version.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          retention-days: 30
          if-no-files-found: warn

      - name: Show toolchain versions
        run: |
          echo "### 🧰 Toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tool | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| JDK | $(java -version 2>&1 | head -n 1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gradle | $(${{ steps.gradle_cmd.outputs.cmd }} --version | grep Gradle) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner OS | $RUNNER_OS |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Android SDK is available
        run: |
          # ubuntu-latest GitHub-hosted runners come with the Android SDK
          # preinstalled at $ANDROID_HOME — no android-actions/setup-android
          # step needed. This just fails loudly and early if that ever
          # changes, instead of letting compile fail with a confusing error.
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not set or does not exist. This runner image no longer ships the Android SDK preinstalled — add the android-actions/setup-android action."
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "compileSdk 36 requires platforms;android-36 — checking it's installed:"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "::warning::platforms;android-36 not found under \$ANDROID_HOME/platforms — installing it now via sdkmanager."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi

      # ---------------------------------------------------------------
      # 3. Compile — fail fast here with a readable Kotlin error summary
      #    before spending time on lint/tests against broken code.
      # ---------------------------------------------------------------
      - name: Compile all modules
        id: compile
        run: |
          set -o pipefail
          GRADLE="${{ steps.gradle_cmd.outputs.cmd }}"
          $GRADLE compileDebugKotlin --console=plain --stacktrace 2>&1 | tee compile.log

      - name: Summarize compile errors (only runs if compile failed)
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "### ❌ Compile failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:" compile.log | head -n 50 >> "$GITHUB_STEP_SUMMARY" || echo "(no 'error:' lines matched — see full log below)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Full log is attached as the **compile-log** artifact." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 4. Static analysis — Android Lint across all modules.
      #    Runs even if later steps would be skipped, so you always get
      #    a lint report for the code that did compile.
      # ---------------------------------------------------------------
      - name: Run Android Lint
        id: lint
        if: success()
        run: |
          set -o pipefail
          GRADLE="${{ steps.gradle_cmd.outputs.cmd }}"
          $GRADLE lintDebug --console=plain --stacktrace 2>&1 | tee lint.log
        continue-on-error: true

      - name: Summarize lint results
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          echo "### 🔍 Lint" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.lint.outcome }}" = "success" ]; then
            echo "✅ No lint errors." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Lint reported issues (warnings do not fail the build). See the **lint-reports** artifact for full HTML reports per module." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------
      # 5. Unit tests — every module's JVM test suite.
      # ---------------------------------------------------------------
      - name: Run unit tests
        id: unit_tests
        if: success()
        run: |
          set -o pipefail
          GRADLE="${{ steps.gradle_cmd.outputs.cmd }}"
          $GRADLE testDebugUnitTest --console=plain --stacktrace 2>&1 | tee unit-tests.log
        continue-on-error: true

      - name: Publish unit test report
        uses: dorny/test-reporter@v1
        if: always() && steps.unit_tests.outcome != 'skipped'
        with:
          name: Unit Test Results
          path: "**/build/test-results/**/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      # ---------------------------------------------------------------
      # 6. Assemble a debug APK. Deliberately debug-only: a release build
      #    needs a signing key, and the whole point of this workflow is
      #    that it runs with zero repo secrets — so no signing config is
      #    wired in. The debug APK is enough to sideload and smoke-test.
      # ---------------------------------------------------------------
      - name: Assemble debug APK
        id: assemble
        if: success()
        run: |
          set -o pipefail
          GRADLE="${{ steps.gradle_cmd.outputs.cmd }}"
          $GRADLE assembleDebug --console=plain --stacktrace 2>&1 | tee assemble.log

      - name: Locate build outputs
        id: find_apk
        if: success()
        run: |
          APK_PATH=$(find . -name "*-debug.apk" -path "*/outputs/apk/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK found under outputs/apk/ — assembleDebug may have produced nothing."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$APK_PATH" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Summarize build
        if: success()
        run: |
          echo "### 📦 APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Path: \`${{ steps.find_apk.outputs.apk_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${{ steps.find_apk.outputs.apk_size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download it from this run's **Artifacts** section below." >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 7. Upload everything useful for debugging, whether or not the
      #    build succeeded. These are what you actually open when a run
      #    is red — full logs plus machine-readable reports.
      # ---------------------------------------------------------------
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            lint.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            unit-tests.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload full assemble log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          retention-days: 14
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # 8. Final rollup so the Summary tab alone tells the whole story
      #    without needing to open any individual step.
      # ---------------------------------------------------------------
      - name: Final summary
        if: always()
        run: |
          echo "### ✅ Result" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compile | ${{ steps.compile.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ steps.lint.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit tests | ${{ steps.unit_tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Assemble APK | ${{ steps.assemble.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
